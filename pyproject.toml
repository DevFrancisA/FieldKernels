[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "fieldkernels"
version = "0.1.0"
description = "Biot-Savart magnetic fields of coil filaments on the GPU (wgpu) and CPU (Rayon), with a NumPy interface"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
test = ["pytest"]

[tool.maturin]
manifest-path = "crates/fieldkernels-py/Cargo.toml"
python-source = "python"
module-name = "fieldkernels._native"

name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
        if: matrix.os == 'ubuntu-latest'
      - run: cargo clippy --workspace --exclude fieldkernels-py --all-targets
        if: matrix.os == 'ubuntu-latest'
      # Hosted runners have no GPU: GPU checks skip themselves when no adapter exists.
      - run: cargo test --release
      - run: cargo run --release -p fieldkernels-cli -- validate
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install maturin numpy pytest
      - run: maturin build --release -o dist
      - run: pip install --no-index --find-links dist fieldkernels
      - run: pytest python/tests -v

[package]
name = "fieldkernels-py"
description = "PyO3 bindings for FieldKernels (NumPy interface)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
fieldkernels-core = { path = "../fieldkernels-core" }
pyo3 = { version = "0.25", features = ["extension-module", "abi3-py39", "generate-import-lib"] }
numpy = "0.25"
